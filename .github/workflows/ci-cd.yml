name: Waper CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sonarcloud:
    name: SonarQ Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

  test:
    name: Run Tests
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

  versioning:
    name: Bump Version
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

  deploy:
    name: Deploy to Render
    needs: versioning
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder Deploy
        run: echo "Deploy job ready"
