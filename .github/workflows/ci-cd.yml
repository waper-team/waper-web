name: Waper CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sonarcloud:
    name: SonarQ Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

  test:
    name: Run Tests
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # Vite 8 necesita una versión de Node compatible para instalar y probar el proyecto.
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
      # npm ci instala lo que fija el lockfile sin modificarlo.
      - name: Install dependencies
        run: npm ci
      # --run hace que Vitest termine al completar la suite, como requiere CI.
      - name: Run Vitest
        run: npm test -- --run

  versioning:
    name: Bump Version
    needs: test
    runs-on: ubuntu-latest
#    permissions: 
#      contents: write
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tagger
        uses: anothrNick/github-tag-action@v1.75.0
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            default_Bump: patch

            MAJOR_STRING_TOKEN: "feat!"
            MINOR_STRING_TOKEN: "feat"
            PATCH_STRING_TOKEN: "fix"

  deploy:
    name: Deploy to Render
    needs: versioning
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Sending deploy trigger to Render..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi
